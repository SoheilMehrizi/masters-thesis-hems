<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research library · Design samples</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 'Segoe UI',Tahoma,sans-serif;background:#eef1f4;color:#18333b}header{padding:22px 28px;background:#fff;border-bottom:1px solid #d2dce0}h1{font-size:24px;margin:0 0 4px}p{margin:4px 0;color:#52686e}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}button,select,a{font:inherit;padding:10px 15px;border:1px solid #c4d2d5;border-radius:8px;background:#fff;color:#24444c;cursor:pointer}button[aria-pressed=true]{background:#163f39;color:#fff;border-color:#163f39}#description{margin-top:12px;font-size:13px}iframe{display:block;width:calc(100% - 32px);height:calc(100vh - 235px);min-height:500px;margin:16px;border:1px solid #c6d0d4;border-radius:10px;background:white}label{display:flex;align-items:center;gap:8px}</style><header><h1>Choose the reading experience · انتخاب سبک</h1><p>Same real content, three visual treatments. Switch between the landing and article to compare readability.</p><div class="controls"><button data-style="editorial" aria-pressed="true">01 · Editorial research library</button><button data-style="dashboard" aria-pressed="false">02 · Technical dashboard</button><button data-style="journal" aria-pressed="false">03 · Academic journal</button><label>Preview <select id="page"><option value="index.html">Main landing</option><option value="la-upahem.html">LA-UPAHEM report</option><option value="article-02.html">Huang / EECL report</option></select></label><label>Language <select id="lang"><option value="en">English</option><option value="fa">فارسی</option></select></label></div><p id="description"></p></header><iframe id="preview" title="Interactive design preview" src="index.html"></iframe><script>
const frame=document.getElementById('preview');let selected='editorial';
const descriptions={editorial:'Editorial: quiet neutral background, green accents, spacious reading column, clear section hierarchy. / سبک تحریریه: فضای باز و تمرکز بر مطالعه',dashboard:'Dashboard: navy background, compact panels, blue accents, dense information layout. / داشبورد فنی: چیدمان فشرده و رنگ تیره',journal:'Journal: warm paper, serif headings, restrained color, traditional academic reading. / مجله علمی: ظاهر کاغذی و کمینه‌گرا'};
const variants={dashboard:`:root{--bg:#101d30;--card:#192b43;--ink:#e6eef7;--mut:#a1b5ca;--line:#304661;--tint:#203d58}body{background:var(--bg);font-size:14px;color:var(--ink)}nav{background:#101d30}a,.cite{color:#7ed5ef}main{max-width:1500px;padding:24px}.hero{padding:18px 0}.hero h1{font:650 40px/1.2 'Segoe UI',sans-serif;letter-spacing:-.03em}.sub{font-size:15px}.grid{gap:12px}.grid .card,.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px}.grid .card:hover{background:#233b55}.grid .card{min-height:260px}.stats{background:#1e4058}.stats .card{padding:16px}.notice{background:#1c3547;border-color:#34526a;color:#bfdae2}.critical{background:#423c2b}.toc a{color:#b2c8df}.report .panel{padding:25px}details{background:#13283b}.cite{background:#1e3b4c;border-color:#375969}th{background:#234359}button,.btn,select,input{background:#20344b;color:#e4eef8;border-color:#3d526a}.toolbar{background:#192b43}.toolbar input,.toolbar select{background:#20344b;color:#e4eef8}.pill{background:#245b57;color:#b4f0db}.queued{background:#3b4251;color:#c4cbd3}.card .btn{color:#94dfd4}.cover{background:#fff}.fa{color:inherit!important}`,
journal:`:root{--bg:#f7f3ea;--ink:#302b25;--mut:#756b60;--line:#d8cfbf;--tint:#f1ebdf}body{font-family:Georgia,'Times New Roman',Tahoma,serif;font-size:18px;background:var(--bg)}nav{background:#f7f3ea;font-family:'Segoe UI',Tahoma,sans-serif}main{max-width:1190px}.hero{border-bottom:3px double #b9aa92;text-align:center;padding:30px 10px}.hero h1{font-family:Georgia,serif;letter-spacing:-.04em;font-weight:normal;font-size:52px;margin-left:auto;margin-right:auto}.sub{margin-left:auto;margin-right:auto;font-size:18px}.eyebrow{color:#8a6139}.grid{border:0;gap:22px;grid-template-columns:repeat(2,minmax(0,1fr))}.grid .card{background:transparent;border:0;border-top:1px solid #bfae98;border-radius:0;padding:22px 0;box-shadow:none;min-height:280px}.card h3{font-family:Georgia,serif;font-size:23px;font-weight:normal}.stats{background:#eee5d6;color:#3b3024;border-radius:0}.stats .card{border-right-color:#cdbb9f}.report .panel{background:transparent;border:0;border-top:1px solid #c8b89d;border-radius:0;padding:26px 0}.report h2{font-family:Georgia,serif;font-weight:normal;font-size:30px;border:0}.layout{gap:45px}.toc{font-family:'Segoe UI',Tahoma,sans-serif}.notice{background:#eee7d9;color:#69533c;border-color:#d5c3a5;border-left-color:#9c7547}.toolbar{background:#fbf8f1;border-radius:0}.cover{display:none}.cite{font:11px 'Segoe UI',Tahoma,sans-serif;color:#745638;background:#eee4d2;border-color:#deccb2}.pill{background:#e7ecdf;color:#486040}.queued{background:#eee8dc;color:#796d5d}a{color:#76512c}details{background:#f8f5ef;border-color:#d7cbb8}figure h3{background:#766044}h1 .fa,h2 .fa,h3 .fa{font-family:Tahoma,sans-serif}.fa{color:inherit!important}`};
function apply(){const doc=frame.contentDocument;if(!doc)return;doc.querySelectorAll('link[href^="theme.css"],link[href^="design.css"]:not(#preview-base)').forEach(el=>el.remove());doc.querySelector('#preview-style')?.remove();doc.querySelector('#preview-base')?.remove();const base=doc.createElement('link');base.id='preview-base';base.rel='stylesheet';base.href='design.css';doc.head.append(base);const style=doc.createElement('style');style.id='preview-style';style.textContent=variants[selected]||'';doc.head.append(style);doc.body.dataset.lang=document.getElementById('lang').value;const lang=doc.getElementById('language');if(lang)lang.value=doc.body.dataset.lang;document.getElementById('description').textContent=descriptions[selected];document.querySelectorAll('[data-style]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.style===selected));}
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{selected=b.dataset.style;apply()});document.getElementById('page').onchange=e=>{frame.src=e.target.value};document.getElementById('lang').onchange=apply;frame.onload=apply;
</script></html>
