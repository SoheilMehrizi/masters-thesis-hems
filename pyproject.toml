[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hems-sim"
version = "0.1.0"
description = "Reproducible P1 CityLearn and Custom Alameda validation"
requires-python = ">=3.11,<3.12"
dependencies = ["citylearn==3.2.0"]

[project.optional-dependencies]
ui = ["streamlit==1.67.0", "plotly==7.1.0", "pyarrow==19.0.1"]

[tool.setuptools.packages.find]
where = ["src"]
